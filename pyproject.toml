[project]
name = "private-document-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.43.64",
  "PyJWT[crypto]==2.10.1",
  "pypdf==5.1.0",
  "python-docx==1.1.2",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pyright==1.1.391",
  "ruff==0.8.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["services"]
extraPaths = ["services/api/src", "services/ingestion/src", "services/common/src"]
# boto3 exposes dynamically generated clients. Service calls are isolated in adapter modules.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["services/api/src", "services/ingestion/src", "services/common/src"]
